- rest:
    id: rest-forecast
    post:
      - id: postecb9
        path: process
        to: direct:forecast
        consumes: application/json
        produces: application/json
        bindingMode: json
- route:
    id: route-forecast
    from:
      id: from5d9f
      uri: direct
      parameters:
        name: forecast
      steps:
        - setProperty:
            id: setPropertyb67d
            name: timestamp
            expression:
              groovy:
                id: groovyc787
                expression: java.time.Instant.now()
        - setProperty:
            id: setProperty0b4c
            name: requestId
            expression:
              groovy:
                id: groovyfe63
                expression: java.util.UUID.randomUUID()
        - log:
            id: log19af
            message: "\"New request requestId: ${exchangeProperty.requestId} timestamp: ${exchangeProperty.timestamp}\""
        - doTry:
            id: doTry8829
            doCatch:
              - id: doCatchd204
                exception:
                  - org.apache.camel.support.processor.PredicateValidationException
                steps:
                  - setHeader:
                      id: setHeader2846
                      name: CamelHttpResponseCode
                      expression:
                        constant:
                          id: constant355a
                          expression: "400"
                  - setBody:
                      id: setBody1862
                      expression:
                        groovy:
                          id: groovy68b7
                          expression: "\"Invalid request\""
                  - to:
                      id: to3488
                      uri: kamelet:log-action
                      parameters:
                        showAllProperties: true
            steps:
              - validate:
                  id: validatee9de
                  expression:
                    groovy:
                      id: groovy3903
                      expression: body?.name && body?.city
              - setProperty:
                  id: setProperty8317
                  name: name
                  expression:
                    groovy:
                      id: groovyc81c
                      expression: body.name
              - to:
                  id: to5bb4
                  uri: https
                  parameters:
                    httpUri: https://api.open-meteo.com/v1/forecast?latitude=60.4518&longitude=22.2666&current_weather=true
                    httpMethod: GET
                    bridgeEndpoint: true
                    skipRequestHeaders: true
                    skipControlHeaders: true
              - unmarshal:
                  id: unmarshal10c2
                  json:
                    id: jsonfe10
              - setBody:
                  id: setBody7129
                  note: City hard coded "Turku"
                  expression:
                    groovy:
                      id: groovyd807
                      expression: |-
                        [
                            name: exchangeProperty.name,
                            city: "Turku",
                            currentTemperature: body?.current_weather?.temperature,
                            time: body?.current_weather?.time,
                        ]
              - to:
                  id: toeed8
                  uri: kamelet:log-action
                  parameters:
                    showAllProperties: true
